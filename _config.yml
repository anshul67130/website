# Site Settings
title: "Advocate Chandrashekhar Dixit"
email: "CSdixitadv@gmail.com"
description: "Expert legal services since 1980 specializing in Corporate, Criminal, Family, and Real Estate Law"
baseurl: "" # For GitHub Pages, leave empty if using custom domain
url: "https://chambersofchandrashekhardixit.com/" # Replace with your actual domain
lang: "en"
timezone: "Asia/Kolkata"

# Important: Set your site's production URL here
# This is used for absolute URLs in sitemaps, feeds etc.
site_url: "https://chambersofchandrashekhardixit.com"

# Netlify CMS Configuration
collections_dir: "_posts" # Where your content lives

# Collections configuration
collections:
  blog:
    output: true
    permalink: /blog/:year/:month/:day/:title/
    sort_by: date
    sort_direction: descending

# Defaults
defaults:
  - scope:
      path: ""
      type: "blog"
    values:
      layout: "post"
      author: "Chandrashekhar Dixit"
      comments: false

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
paginate: 5
paginate_path: "/blog/page:num/"

# Plugins (for Jekyll)
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - .gitignore
  - netlify.toml
  - README.md

# SASS Configuration
sass:
  style: compressed
  load_paths:
    - _sass

# Netlify Identity Settings
identity:
  enabled: true
  gateway: true

# SEO Settings
seo:
  title: true
  description: true
  image: "/images/logo.webp"
  twitter:
    username: "@yourhandle"
  facebook:
    app_id: "your_app_id"

# Author Information
author:
  name: "Chandrashekhar Dixit"
  bio: "Practicing Advocate since 1980"
  email: "CSdixitadv@gmail.com"
  phone: "+91 9837161413"
  address: "Pan Dariba, 3/8, Railway Station Road, Aligarh, 202001, India"
  social:
    facebook: "https://www.facebook.com/share/15kkth9rJZ/"
    instagram: "https://www.instagram.com/chamberofc.s"
    whatsapp: "https://wa.me/919837161413"

# Custom Variables
theme_color: "#a92210"
brand_color: "#a92210"
accent_color: "#8a1c0d"
